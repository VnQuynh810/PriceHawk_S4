services:
  k6:
    image: grafana/k6:latest
    volumes:
      - ./infra/k6:/scripts:ro
      - ./infra/k6/results:/results
    command: run --out json=/results/result.json /scripts/test.js
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
    networks:
      mynetwork:
        aliases:
          - k6

networks:
  mynetwork:
    external: true
    name: pricehawk_network
