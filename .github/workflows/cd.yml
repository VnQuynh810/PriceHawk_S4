name: CD — Build GHCR Images & Zero-Build Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Multi-Stage Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase GHCR prefix
        id: meta
        run: |
          OWNER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "prefix=ghcr.io/${OWNER_REPO}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-web:latest
            ${{ steps.meta.outputs.prefix }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build & Push Crawler Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/crawler
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-crawler:latest
            ${{ steps.meta.outputs.prefix }}-crawler:${{ github.sha }}
          cache-from: type=gha,scope=crawler
          cache-to: type=gha,mode=max,scope=crawler

      - name: Build & Push Chatbot Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/chatbot
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-chatbot:latest
            ${{ steps.meta.outputs.prefix }}-chatbot:${{ github.sha }}
          cache-from: type=gha,scope=chatbot
          cache-to: type=gha,mode=max,scope=chatbot

  deploy-vps:
    name: Pull Pre-Built Images on Production VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (No CPU/RAM Build Load on VPS!)
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 5m
          script: |
            set -e
            cd /root/pricehawk/PriceHawk_S4
            git fetch origin main
            git reset --hard origin/main

            cat << 'EOF' > .env.product
            ${{ secrets.ENV_PRODUCT }}
            EOF

            export GHCR_IMAGE_PREFIX="${{ needs.build-and-push.outputs.image_prefix }}"
            export IMAGE_TAG="${{ github.sha }}"

            docker compose pull web crawler chatbot searxng
            docker compose up -d --no-build --remove-orphans
            docker image prune -f
